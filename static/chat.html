<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>喵宇宙社区聊天 · YUI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",system-ui,sans-serif; }
  body { height:100vh; background:#f4f5f7; overflow:hidden; }
  #app { display:flex; height:100vh; }
  /* 左侧会话栏 */
  #sidebar { width:200px; background:#2b2f3a; color:#cfd3dc; display:flex; flex-direction:column; }
  #sidebar .brand { padding:16px 14px; font-size:14px; font-weight:600; color:#fff; border-bottom:1px solid #3a3f4d; }
  #sidebar .brand small { display:block; color:#8a90a0; font-weight:400; margin-top:3px; font-size:11px; }
  #sidebar .item { padding:11px 14px; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:8px; }
  #sidebar .item.active { background:#3d4352; color:#fff; }
  #sidebar .item .dot { width:6px; height:6px; border-radius:50%; background:#4caf50; }
  /* 主区 */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #header { height:52px; background:#fff; border-bottom:1px solid #e3e5e8; display:flex; align-items:center; padding:0 16px; gap:10px; }
  #header .avatar { width:34px; height:34px; border-radius:8px; background:linear-gradient(135deg,#7ec8ff,#b18cff); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; }
  #header .name { font-size:14px; font-weight:600; }
  #header .status { font-size:11px; color:#8a90a0; }
  #header .status.on { color:#4caf50; }
  #messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { display:flex; gap:8px; max-width:72%; }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .msg .bubble { padding:9px 12px; border-radius:12px; font-size:13px; line-height:1.55; word-break:break-word; white-space:pre-wrap; }
  .msg.user .bubble { background:#95ec69; }
  .msg.yui .bubble { background:#fff; border:1px solid #e3e5e8; }
  .msg .meta { font-size:10px; color:#a2a6ad; align-self:flex-end; }
  #inputbar { display:flex; gap:10px; padding:12px 16px; background:#fff; border-top:1px solid #e3e5e8; }
  #input { flex:1; border:1px solid #d9dce1; border-radius:8px; padding:10px 12px; font-size:13px; outline:none; resize:none; height:42px; }
  #send { width:76px; background:#5aa7ff; color:#fff; border:none; border-radius:8px; font-size:13px; cursor:pointer; }
  #send:disabled { background:#c9d4e6; cursor:not-allowed; }
  .tip { text-align:center; font-size:11px; color:#a2a6ad; margin:4px 0; }
  #feedView { display:none; flex:1; overflow-y:auto; padding:16px; }
  .post { background:#fff; border:1px solid #e3e5e8; border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .post .author { font-size:12px; font-weight:600; color:#333; margin-bottom:4px; }
  .post .content { font-size:13px; color:#444; line-height:1.5; }
  .post .time { font-size:11px; color:#a2a6ad; margin-top:6px; }
  .err { color:#e0513f; font-size:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand">喵宇宙社区聊天<small>neko_community_chat</small></div>
    <div class="item active" data-view="chat"><span class="dot"></span>和 YUI 聊天</div>
    <div class="item" data-view="feed"><span class="dot"></span>社区动态</div>
  </div>
  <div id="main">
    <div id="header">
      <div class="avatar">喵</div>
      <div>
        <div class="name">YUI</div>
        <div class="status on" id="yuiStatus">在线 · 本地</div>
      </div>
    </div>
    <div id="messages"></div>
    <div id="feedView"></div>
    <div id="inputbar">
      <textarea id="input" placeholder="和 YUI 说点什么…（Enter 发送）"></textarea>
      <button id="send">发送</button>
    </div>
  </div>
</div>
<script>
const API = "http://127.0.0.1:7870";
let lastId = 0;
let view = "chat";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderMessage(m) {
  const wrap = el("div", "msg " + (m.sender === "user" ? "user" : "yui"));
  const bubble = el("div", "bubble", m.text);
  const meta = el("div", "meta", m.ts || "");
  wrap.appendChild(bubble);
  wrap.appendChild(meta);
  return wrap;
}

function scrollBottom() {
  const box = document.getElementById("messages");
  box.scrollTop = box.scrollHeight;
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  const btn = document.getElementById("send");
  btn.disabled = true;
  try {
    const r = await fetch(API + "/api/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, sender: "user" })
    });
    const j = await r.json();
    if (j.ok && j.message) {
      const box = document.getElementById("messages");
      box.appendChild(renderMessage(j.message));
      lastId = Math.max(lastId, Number(j.message.id) || 0);
      scrollBottom();
    } else {
      const box = document.getElementById("messages");
      box.appendChild(el("div", "tip err", "发送失败：" + (j.error || "未知")));
    }
  } catch (e) {
    const box = document.getElementById("messages");
    box.appendChild(el("div", "tip err", "本地服务不可达：" + e.message));
  } finally {
    btn.disabled = false;
  }
}

async function poll() {
  try {
    const r = await fetch(API + "/api/messages?after_id=" + lastId);
    const j = await r.json();
    if (j.ok && Array.isArray(j.messages) && j.messages.length) {
      const box = document.getElementById("messages");
      for (const m of j.messages) {
        box.appendChild(renderMessage(m));
        lastId = Math.max(lastId, Number(m.id) || 0);
      }
      scrollBottom();
    }
  } catch (e) { /* 服务未启动时静默，面板仍可显示 */ }
}

async function loadFeed() {
  const view = document.getElementById("feedView");
  view.innerHTML = "";
  try {
    const r = await fetch(API + "/api/feed");
    const j = await r.json();
    let data = j.data;
    try { data = JSON.parse(data); } catch (e) {}
    let list = [];
    if (data && Array.isArray(data.posts)) list = data.posts;
    else if (data && Array.isArray(data.data)) list = data.data;
    if (!list.length) {
      view.appendChild(el("div", "tip", "社区暂无动态"));
      return;
    }
    for (const p of list) {
      const post = el("div", "post");
      post.appendChild(el("div", "author", p.author || p.user?.name || "社区用户"));
      post.appendChild(el("div", "content", p.content || p.text || p.title || JSON.stringify(p).slice(0, 120)));
      post.appendChild(el("div", "time", p.created_at || ""));
      view.appendChild(post);
    }
  } catch (e) {
    view.appendChild(el("div", "tip err", "社区动态读取失败：" + e.message));
  }
}

document.getElementById("send").addEventListener("click", send);
document.getElementById("input").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(); }
});
document.querySelectorAll("#sidebar .item").forEach(item => {
  item.addEventListener("click", () => {
    document.querySelectorAll("#sidebar .item").forEach(i => i.classList.remove("active"));
    item.classList.add("active");
    view = item.dataset.view;
    document.getElementById("messages").style.display = view === "chat" ? "flex" : "none";
    document.getElementById("feedView").style.display = view === "feed" ? "block" : "none";
    document.getElementById("inputbar").style.display = view === "chat" ? "flex" : "none";
    if (view === "feed") loadFeed();
  });
});

(async function init() {
  try {
    const r = await fetch(API + "/api/history");
    const j = await r.json();
    if (j.ok && Array.isArray(j.messages)) {
      const box = document.getElementById("messages");
      for (const m of j.messages) {
        box.appendChild(renderMessage(m));
        lastId = Math.max(lastId, Number(m.id) || 0);
      }
      scrollBottom();
    }
  } catch (e) {
    document.getElementById("messages").appendChild(el("div", "tip err", "本地服务不可达：" + e.message));
  }
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
