[plugin]
id = "neko_community_chat"
name = "喵宇宙社区聊天"
description = """
让 YUI 接入喵宇宙社区（community.project-neko.cn）的多节点聊天插件（v0.2 互联版）：
本地跑消息服务（127.0.0.1:7870）+ 类似 QQ 的聊天面板（独立页 & 社区网页注入气泡），与 YUI 实时对话
（后台唤醒 YUI、YUI 用 community_chat_send 回消息），聊天历史存本地。
互联（自建社区墙）：同一局域网自动发现（UDP 广播）直接互通；配置公网中继（relay/worker.js，
Cloudflare Worker）后全球所有装了本插件的节点都能互相聊天、互发社区动态——面板发消息可选定向回复
远端用户，YUI 回复可跨节点送达。社区动态 tab = 自建墙（所有节点发帖）+ 官方社区只读流。
何时用：用户说'和YUI聊天/社区聊天/喵宇宙聊天/打开聊天面板/社区动态/看看社区有什么新动态/和别处的用户聊天'时。
回复纪律：直接给出消息内容或操作结果，不编造聊天记录、不假装已发送未发出的消息。
"""
short_description = "喵宇宙社区聊天：本地+多节点互联（局域网/公网中继）消息服务，QQ 式聊天面板，YUI 实时对话，自建社区墙"
keywords = ["聊天", "chat", "喵宇宙", "社区", "community", "nekoverse", "消息", "message", "面板", "chat panel", "YUI", "对话", "即时通讯", "IM", "浏览器面板", "hosted-ui", "动态", "feed", "油猴", "userscript", "互联", "局域网", "LAN", "中继", "relay", "社区墙"]
version = "0.2.1"
type = "plugin"
entry = "plugin.plugins.neko_community_chat:NekoCommunityChatPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "community_chat"
title = "喵宇宙聊天"
entry = "static/index.html"
context = "community_chat"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
id = "quickstart"
title = "怎么用"
entry = "docs/guide.md"
