[plugin]
id = "neko_community_chat"
name = "喵宇宙社区聊天"
description = """
让 YUI 接入喵宇宙社区的多人聊天插件（v0.3 全球互通版）：
本地跑消息服务（127.0.0.1:7870）+ 类似 QQ 的聊天面板（独立页 & 可嵌入网页），与 YUI 实时对话
（后台唤醒 YUI、YUI 用 community_chat_send 回消息），聊天历史存本地。
互联（三层通道）：① 公网通道（默认开启，零配置）：公共 MQTT broker 全球互通（默认 broker.hivemq.com，
自动回退 broker.mqttdashboard.com / broker.emqx.io，国内可达）——任何安装了本插件的节点开箱即聊，含昵称、
定向回复（YUI 回复可跨节点送达）；② 局域网：同网段 UDP 自动
发现直连互通；③ 自建中继：配置 relay/worker.js（Cloudflare Worker）后走自有中继（支持离线信箱，
自动跟随系统代理/WARP 加速）。
社区动态 tab = 自建墙（所有节点发帖），全部走自建通道。
何时用：用户说'和YUI聊天/社区聊天/喵宇宙聊天/打开聊天面板/社区动态/看看社区有什么新动态/和别处的用户聊天'时。
回复纪律：直接给出消息内容或操作结果，不编造聊天记录、不假装已发送未发出的消息。
"""
short_description = "喵宇宙社区聊天：全球互通（公网MQTT零配置·多broker自动回退）+局域网自动发现，QQ 式聊天面板，YUI 实时对话，自建社区墙"
keywords = ["聊天", "chat", "喵宇宙", "社区", "community", "nekoverse", "消息", "message", "面板", "chat panel", "YUI", "对话", "即时通讯", "IM", "浏览器面板", "hosted-ui", "动态", "feed", "互联", "局域网", "LAN", "中继", "relay", "公网", "MQTT", "全球", "社区墙"]
version = "0.3.3"
type = "plugin"
entry = "plugin.plugins.neko_community_chat:NekoCommunityChatPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "community_chat"
title = "喵宇宙聊天"
entry = "static/index.html"
context = "community_chat"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
id = "quickstart"
title = "怎么用"
entry = "docs/guide.md"
